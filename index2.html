<!DOCTYPE html>
<html>
<head>
    <title>Caffeinetor</title>

    <style>
        body {
            background-color: #dfffe8; /* pastel green */
            font-family: "Poppins", sans-serif;
            color: #2e6f4e;
            padding: 40px;
            text-align: center;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 10px;
            color: #2e6f4e;
        }

        p {
            font-size: 20px;
            margin-bottom: 40px;
            color: #2e6f4e;
        }

        .box {
            width: 300px;
            height: 120px;
            background-color: #b8f5cf;
            border-radius: 20px;
            margin: 0 auto 40px auto;
        }

        button {
            background: #b8f5cf;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-size: 20px;
            color: #2e6f4e;
            cursor: pointer;
            transition: 0.2s;
        }

        button:hover {
            background: #a2f0c3;
        }
    </style>
</head>

<body>

    <h1> Caffeinetor - your caffeine diary</h1>

    <p>Caffeine counter for teens, who want to safely drink energy drinks and keep their caffeine in control.</p>
    
    <div class="box"></div>

    <a href="questions.html">
    <button type="button">Get started</button>
</a>


</body>
</html>
